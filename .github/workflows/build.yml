name: Build APK
on: { push: { branches: ["**"] }, workflow_dispatch: }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK 34 (runner SDK preinstalled)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"; ls "$ANDROID_HOME" || true; which sdkmanager || true
          SDKM=$(command -v sdkmanager || ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKM"; yes | "$SDKM" --licenses >/dev/null 2>&1 || true; "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build release APK (debug-signed for sideloading)
        run: set -o pipefail; gradle assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Push build log on failure (diagnostics)
        if: failure()
        run: |
          tail -250 build.log > BUILD_LOG.txt || true
          git config user.email ci@github.com; git config user.name ci
          git add BUILD_LOG.txt; git commit -m "CI build log" || exit 0
          git push origin HEAD:arena/5082c47d-insta-working-app || true
      - name: Stage APK
        run: cp app/build/outputs/apk/release/app-release.apk InstaScope.apk
      - uses: actions/upload-artifact@v4
        with: { name: InstaScope-apk, path: InstaScope.apk }
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/arena/5082c47d-insta-working-app'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: InstaScope v1.0.0
          files: InstaScope.apk
          body: "Install: download InstaScope.apk, allow install from browser/files, open, paste an Instagram link or @handle, tap Scan. Optional HikerAPI token field enables the API profile/posts path."
